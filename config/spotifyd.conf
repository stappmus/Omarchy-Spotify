[global]
device_name = "Omarchy Spotify"
device_type = "computer"
backend = "pulseaudio"
bitrate = 320
autoplay = true
volume_controller = "softvol"
use_mpris = true
dbus_type = "session"
no_audio_cache = false
max_cache_size = 1000000000
# Set to false to advertise this computer to phones on the same network,
# including guests signed in to other Spotify accounts. Set zeroconf_port to
# a fixed port when a firewall has to allow it; 0 picks a free port.
disable_discovery = true
# zeroconf_port = 5354
