[package]
name = "omarchy-spotify-backend"
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Plugin-owned Spotify Connect playback backend for QuickshellSpotify"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
hex = "0.4"
librespot-connect = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false }
librespot-core = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false, features = ["native-tls"] }
librespot-metadata = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false }
librespot-oauth = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false }
librespot-playback = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false, features = ["pulseaudio-backend"] }
log = "0.4"
mpris-server = { version = "=0.10.0", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = "0.9"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"

# Bind the callback before opening authorization (stappmus/librespot#1).
[patch."https://github.com/stappmus/librespot"]
librespot-oauth = { git = "https://github.com/Brams-s/librespot", rev = "8f6afe00eb5b428dde0e0023e126a14a577a2cec" }
